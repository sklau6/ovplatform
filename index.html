<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050809" />
    <meta name="description" content="Ophylla Urban OS — an executive command environment for smart-city operations, digital twins, AI decision support and trusted asset data." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ophylla Urban OS · COO Command</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ophylla-theme');
          var locale = localStorage.getItem('ophylla-locale');
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
          if (locale) document.documentElement.lang = locale;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
